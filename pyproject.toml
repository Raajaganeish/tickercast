[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tickercast"
version = "0.1.0"
description = "Stock direction forecasting with a PatchTST Transformer: data pipeline, validation and training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "yfinance>=0.2.40",
    "fredapi>=0.5",
    "lxml>=5",
    "requests>=2.31",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
model = ["torch>=2.3"]
dev = ["pytest>=8", "jupyter>=1.0", "ipykernel>=6"]

[project.scripts]
tickercast = "tickercast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
